<g transform="translate(540,230) rotate(-2)"><g class="pop" style="animation-delay:0.2s"><rect x="-239" y="-64.6" width="478" height="108.80000000000001" rx="23.799999999999997" fill="#fff" stroke="#3b2a20" stroke-width="6"/><text x="0" y="20.4" text-anchor="middle" font-family="Baloo Da 2" font-weight="800" font-size="68" fill="#0d47a1">জাহাজে বেতার</text></g></g></svg>