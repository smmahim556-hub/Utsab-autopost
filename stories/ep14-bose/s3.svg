<g transform="translate(860,1330) scale(0.9)"><path d="M0 0 Q0 -120 0 -240" fill="none" stroke="#2e7d32" stroke-width="16" stroke-linecap="round"/><ellipse cx="-60" cy="-150" rx="60" ry="24" fill="#66bb6a" stroke="#3b2a20" stroke-width="5" transform="rotate(-25 -60 -150)"/><ellipse cx="60" cy="-200" rx="60" ry="24" fill="#81c784" stroke="#3b2a20" stroke-width="5" transform="rotate(25 60 -200)"/><circle cx="0" cy="-245" r="18" fill="#ffeb3b" stroke="#3b2a20" stroke-width="4"/></g>
