<g transform="translate(790,900)"><rect x="-150" y="-330" width="300" height="330" fill="#7cc8f2" opacity=".85"/><g transform="translate(0,-140) scale(0.8)"><path d="M-70 40 L-80 -40 L-40 -6 L0 -60 L40 -6 L80 -40 L70 40 Z" fill="#ffc93c" stroke="#3b2a20" stroke-width="6" stroke-linejoin="round"/><rect x="-72" y="30" width="144" height="22" rx="6" fill="#f2a900" stroke="#3b2a20" stroke-width="5"/><circle cx="0" cy="0" r="12" fill="#e63946" stroke="#3b2a20" stroke-width="4"/><circle cx="-44" cy="18" r="8" fill="#3fa9f5" stroke="#3b2a20" stroke-width="3"/><circle cx="44" cy="18" r="8" fill="#3fa9f5" stroke="#3b2a20" stroke-width="3"/></g><path d="M-160 -380 L-160 0 L160 0 L160 -330 L210 -345" fill="none" stroke="#3b2a20" stroke-width="9" stroke-linejoin="round"/></g>
