<g transform="translate(540,230) rotate(-2)"><g class="pop" style="animation-delay:0.2s"><rect x="-249.5" y="-62.699999999999996" width="499" height="105.60000000000001" rx="23.099999999999998" fill="#fff" stroke="#3b2a20" stroke-width="6"/><text x="0" y="19.8" text-anchor="middle" font-family="Baloo Da 2" font-weight="800" font-size="66" fill="#1b5e20">শহর থেকে শহরে</text></g></g></svg>