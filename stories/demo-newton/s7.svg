<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1920" width="1080" height="1920"><style>
:where([class]:not([class=''])){transform-box:fill-box}
.drift{animation:drift 9s linear infinite}@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(60px)}}
.drift2{animation:drift 12s linear infinite reverse}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}@keyframes sway{50%{transform:rotate(2deg)}}
.breathe{transform-origin:50% 100%;animation:breathe 2.4s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.015,1.025)}}
.pop{transform-origin:center;animation:pop .6s cubic-bezier(.3,1.7,.5,1) both}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.twinkle{transform-origin:center;animation:tw 1.6s ease-in-out infinite}@keyframes tw{50%{transform:scale(.5);opacity:.4}}
.spin{transform-origin:center;animation:spin 20s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.bob{transform-origin:center;animation:bob 1.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-22px)}}
.beam{animation:beam 1.2s ease-out .2s both}@keyframes beam{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fan{transform-origin:0% 50%;animation:fan 1s ease-out 1s both}@keyframes fan{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
.shim{animation:shim 1.4s ease-in-out infinite alternate}@keyframes shim{to{opacity:.65}}
.btn{transform-origin:center;animation:btn 1s ease-in-out infinite}@keyframes btn{50%{transform:scale(1.07)}}</style><defs><linearGradient id="dk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1340"/><stop offset="1" stop-color="#24124a"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#dk)"/><circle class="twinkle" style="animation-delay:0s" cx="10" cy="60" r="3" fill="#fff8c4"/><circle class="twinkle" style="animation-delay:0.23s" cx="207" cy="191" r="5" fill="#fff8c4"/><circle class="twinkle" style="animation-delay:0.46s" cx="404" cy="322" r="7" fill="#fff8c4"/><circle class="twinkle" style="animation-delay:0.6900000000000001s" cx="601" cy="453" r="3" fill="#fff8c4"/><circle class="twinkle" style="animation-delay:0.92s" cx="798" cy="584" r="5" fill="#fff8c4"/><circle class="twinkle" style="animation-delay:1.1500000000000001s" cx="995" cy="715" r="7" fill="#fff8c4"/><circle class="twinkle" style="animation-delay:1.3800000000000001s" cx="132" cy="846" r="3" fill="#fff8c4"/><circle class="twinkle" style="animation-delay:0s" cx="329" cy="977" r="5" fill="#fff8c4"/><circle class="twinkle" style="animation-delay:0.23s" cx="526" cy="1108" r="7" fill="#fff8c4"/><circle class="twinkle" style="animation-delay:0.46s" cx="723" cy="89" r="3" fill="#fff8c4"/><circle class="twinkle" style="animation-delay:0.6900000000000001s" cx="920" cy="220" r="5" fill="#fff8c4"/><circle class="twinkle" style="animation-delay:0.92s" cx="57" cy="351" r="7" fill="#fff8c4"/><circle class="twinkle" style="animation-delay:1.1500000000000001s" cx="254" cy="482" r="3" fill="#fff8c4"/><circle class="twinkle" style="animation-delay:1.3800000000000001s" cx="451" cy="613" r="5" fill="#fff8c4"/><circle class="twinkle" style="animation-delay:0s" cx="648" cy="744" r="7" fill="#fff8c4"/><circle class="twinkle" style="animation-delay:0.23s" cx="845" cy="875" r="3" fill="#fff8c4"/><circle class="twinkle" style="animation-delay:0.46s" cx="1042" cy="1006" r="5" fill="#fff8c4"/><