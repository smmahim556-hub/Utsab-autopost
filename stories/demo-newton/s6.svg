.bob{transform-origin:center;animation:bob 1.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-22px)}}
.cf{animation:cf 3s linear infinite}@keyframes cf{from{transform:translateY(0) rotate(0)}to{transform:translateY(1400px) rotate(540deg)}}
