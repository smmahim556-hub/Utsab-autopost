name: Utsab TV reels
on:
  schedule:
    # Normally started at 22:00 Dhaka by the autopost workflow; these late GitHub crons are only a backup.
    - cron: '0 16 * * *'   # the script checks the hour and posts once per day per Page
    - cron: '30 16 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      demo:
        description: 'Only build the video into preview/ (posts nothing)'
        type: boolean
        default: true
      kind:
        description: 'Which reel: top10 (night), weather (morning) or prayer (before Fajr)'
        type: choice
        options: [top10, weather, prayer]
        default: top10
concurrency: reel-${{ inputs.kind || 'top10' }}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      # The browser download is quick; the apt part (--with-deps) sometimes hangs for 15+ minutes and
      # blocks every later run. The runner image already has Chrome's libraries, so apt is best-effort.
      - run: npx playwright install chromium
      - timeout-minutes: 3
        continue-on-error: true
        run: npx playwright install-deps chromium
      - run: sudo apt-get install -y ffmpeg
      - run: node autopost.js
        if: github.event_name == 'workflow_dispatch' || (vars.REEL || '1') == '1'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID_2: ${{ secrets.FB_PAGE_ID_2 }}
          FB_PAGE_TOKEN_2: ${{ secrets.FB_PAGE_TOKEN_2 }}
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
          REEL_RUN: ${{ (github.event_name == 'schedule' || !inputs.demo) && '1' || '0' }}
          REEL_KIND: ${{ inputs.kind || 'top10' }}
          DEMO_REEL: ${{ (github.event_name == 'workflow_dispatch' && inputs.demo) && '1' || '0' }}
      - name: Save state
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state preview 2>/dev/null || git add state
          git diff --cached --quiet || (git commit -m "update reel state" && (git push || (git pull --rebase -X theirs origin main && git push)))
