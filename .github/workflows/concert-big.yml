name: Concert reels from a big Drive file
on:
  workflow_dispatch:
    inputs:
      drive_id: { type: string, description: 'Google Drive file id of the concert recording', required: true }
      start_after: { type: string, description: 'Schedule after this Dhaka time (YYYY-MM-DDTHH:MM); empty = after the concert queue', default: '' }
      dry: { type: string, description: '1 = plan only (song list + sample reel), do not post', default: '' }
      rehook: { type: string, description: '1 = rewrite the saved plan headlines from the lyrics (no posting); 2 = same, with the video for a new sample', default: '' }
      sample: { type: string, description: '1 = sample reels: ElevenLabs lyric headline vs topic headline; 2 = rewrite all plan headlines that way (no posting)', default: '' }
concurrency: concert-big
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx playwright install chromium && (which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg))
      # The recording is too big for the root disk: work on /mnt.
      - run: sudo mkdir -p /mnt/big && sudo chown "$USER" /mnt/big && df -h / /mnt
      # The show's audio is cached, so re-planning does not download the big file again (Drive's daily download quota).
      - uses: actions/cache/restore@v4
        with:
          path: /mnt/big/all.mp3
          key: concert-big-audio-${{ inputs.drive_id }}
      - run: node ${{ inputs.sample != '' && 'tools/concert-sample.js' || 'tools/concert-big.js' }}
        env:
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ID_2: ${{ secrets.FB_PAGE_ID_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          APPLY: ${{ inputs.sample == '2' && '1' || '' }}
          DRIVE_ID: ${{ inputs.drive_id }}
          START_AFTER: ${{ inputs.start_after }}
          DRY: ${{ inputs.dry }}
          REHOOK: ${{ inputs.rehook != '' && '1' || '' }}
          REHOOK_VIDEO: ${{ inputs.rehook == '2' && '1' || '' }}
      - if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: /mnt/big/all.mp3
          key: concert-big-audio-${{ inputs.drive_id }}
      - if: always()
        run: |
          git config user.name "autopost-bot"; git config user.email "autopost-bot@users.noreply.github.com"
          git add -A preview/concert-big preview/concert-sample state/concert-big-*.json state/concert-sample-*.json; git pull -q --rebase -X theirs origin main || true
          git diff --cached --quiet || (git commit -m "concert-big" && (git push || (git pull --rebase -X theirs origin main && git push)))
