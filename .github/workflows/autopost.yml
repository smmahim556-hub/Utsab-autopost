name: Utsab TV autopost
on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      check:
        description: 'Only test the Facebook tokens (posts nothing)'
        type: boolean
        default: false
      demo_link:
        description: 'Make a demo card for this news link only (posts nothing)'
        type: string
        default: ''
      demo_weather:
        description: 'Make a demo weather card for this division (posts nothing)'
        type: string
        default: ''
      demo_prayer:
        description: 'Make demo prayer-time cards (posts nothing)'
        type: boolean
        default: false
      demo_sports:
        description: 'Make demo sports cards (posts nothing)'
        type: boolean
        default: false
      demo_ent:
        description: 'Make demo entertainment cards (posts nothing)'
        type: boolean
        default: false
      demo_mun:
        description: 'Make demo missing-child cards (posts nothing)'
        type: boolean
        default: false
      demo_ratio:
        description: 'Demo card size: 4:5, 1:1, 16:9, 9:16 or story'
        type: string
        default: '9:16'
concurrency: ${{ (inputs.demo_weather || inputs.demo_link || inputs.demo_prayer || inputs.demo_sports || inputs.demo_ent || inputs.demo_mun) && 'autopost-demo' || 'autopost' }}   # demos post nothing, so they do not queue behind the news runs
permissions:
  contents: write
  actions: write   # to start the nightly reel workflow
jobs:
  run:
    runs-on: ubuntu-24.04   # ubuntu-latest moved to 26, which Playwright 1.56 does not support
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # latest state/seen.json, not the commit the run was queued on
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      # The browser download is quick; the apt part (--with-deps) sometimes hangs for 15+ minutes and
      # blocks every later run. The runner image already has Chrome's libraries, so apt is best-effort.
      - run: npx playwright install chromium
      - timeout-minutes: 3
        continue-on-error: true
        run: npx playwright install-deps chromium
      - run: node autopost.js
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID_2: ${{ secrets.FB_PAGE_ID_2 }}
          FB_PAGE_TOKEN_2: ${{ secrets.FB_PAGE_TOKEN_2 }}
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
          STORY: ${{ vars.STORY || '1' }}
          CHECK: ${{ inputs.check && '1' || '0' }}
          DEMO_LINK: ${{ inputs.demo_link }}
          WEATHER: ${{ vars.WEATHER || '1' }}
          DEMO_WEATHER: ${{ inputs.demo_weather }}
          WEATHER_ART: ${{ inputs.demo_weather != '' && '1' || vars.WEATHER_ART || '1' }}
          PRAYER: ${{ vars.PRAYER || '1' }}
          DEMO_PRAYER: ${{ inputs.demo_prayer && '1' || '0' }}
          SPORTS: ${{ vars.SPORTS || '1' }}
          DEMO_SPORTS: ${{ inputs.demo_sports && '1' || '0' }}
          ENT: ${{ vars.ENT || '1' }}
          GM: ${{ vars.GM || '1' }}
          MUN: ${{ vars.MUN || '1' }}
          MUN_FOUND: ${{ vars.MUN_FOUND || '1' }}
          MUN_DEAD_CARD: ${{ vars.MUN_DEAD_CARD || '1' }}
          DEMO_MUN: ${{ inputs.demo_mun && '1' || '0' }}
          DEMO_ENT: ${{ inputs.demo_ent && '1' || '0' }}
          DEMO_RATIO: ${{ inputs.demo_ratio }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cards, path: out/, if-no-files-found: ignore, retention-days: 3 }
      - name: Start the nightly reel
        if: inputs.demo_weather == '' && inputs.demo_link == '' && !inputs.check && !inputs.demo_prayer && !inputs.demo_sports && !inputs.demo_ent && !inputs.demo_mun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(TZ=Asia/Dhaka date +%F); h=$(TZ=Asia/Dhaka date +%-H)
          if [ "${{ vars.REEL || '1' }}" = 1 ] && [ "$h" -ge 22 ] && [ "$(cat state/reel-dispatch.txt 2>/dev/null)" != "$d" ]; then
            gh workflow run reel.yml -f demo=false && echo "$d" > state/reel-dispatch.txt
          fi
          # Morning weather reel: once all division cards are out and the last one is 15+ minutes old.
          if [ "${{ vars.WEATHER_REEL || '1' }}" = 1 ] && [ -f state/weather.json ] && [ "$(jq -r .date state/weather.json)" = "$d" ] \
             && [ "$(jq '.done|length' state/weather.json)" -ge 8 ] && [ $(( $(date +%s) * 1000 - $(jq .lastAt state/weather.json) )) -ge 900000 ] \
             && [ "$(cat state/weather-reel-dispatch.txt 2>/dev/null)" != "$d" ]; then
            gh workflow run reel.yml -f demo=false -f kind=weather && echo "$d" > state/weather-reel-dispatch.txt
          fi
          # Prayer reel: once the 8 division schedule cards are out and the last one is 5+ minutes old.
          if [ "${{ vars.PRAYER_REEL || '1' }}" = 1 ] && [ -f state/prayer.json ] && [ "$(jq -r .date state/prayer.json)" = "$d" ] \
             && [ "$(jq '.sched|length' state/prayer.json)" -ge 8 ] && [ $(( $(date +%s) * 1000 - $(jq .lastAt state/prayer.json) )) -ge 300000 ] \
             && [ "$(cat state/prayer-reel-dispatch.txt 2>/dev/null)" != "$d" ]; then
            gh workflow run reel.yml -f demo=false -f kind=prayer && echo "$d" > state/prayer-reel-dispatch.txt
          fi
      - name: Save seen links
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state preview 2>/dev/null || git add state
          git diff --cached --quiet || (git commit -m "update seen links" && (git push || (git pull --rebase -X theirs origin main && git push)))
