name: Utsab TV autopost
on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      check:
        description: 'Only test the Facebook tokens (posts nothing)'
        type: boolean
        default: false
      demo_link:
        description: 'Make a demo card for this news link only (posts nothing)'
        type: string
        default: ''
      demo_weather:
        description: 'Make a demo weather card for this division (posts nothing)'
        type: string
        default: ''
      demo_ratio:
        description: 'Demo card size: 4:5, 1:1, 16:9, 9:16 or story'
        type: string
        default: '9:16'
concurrency: ${{ (inputs.demo_weather || inputs.demo_link) && 'autopost-demo' || 'autopost' }}   # demos post nothing, so they do not queue behind the news runs
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04   # ubuntu-latest moved to 26, which Playwright 1.56 does not support
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # latest state/seen.json, not the commit the run was queued on
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node autopost.js
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID_2: ${{ secrets.FB_PAGE_ID_2 }}
          FB_PAGE_TOKEN_2: ${{ secrets.FB_PAGE_TOKEN_2 }}
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
          STORY: ${{ vars.STORY || '1' }}
          CHECK: ${{ inputs.check && '1' || '0' }}
          DEMO_LINK: ${{ inputs.demo_link }}
          WEATHER: ${{ vars.WEATHER || '1' }}
          DEMO_WEATHER: ${{ inputs.demo_weather }}
          DEMO_RATIO: ${{ inputs.demo_ratio }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cards, path: out/, if-no-files-found: ignore, retention-days: 3 }
      - name: Save seen links
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state preview 2>/dev/null || git add state
          git diff --cached --quiet || (git commit -m "update seen links" && (git push || (git pull --rebase -X theirs origin main && git push)))
