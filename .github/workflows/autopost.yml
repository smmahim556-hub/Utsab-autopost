name: Utsab TV autopost
on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      check:
        description: 'Only test the Facebook tokens (posts nothing)'
        type: boolean
        default: false
concurrency: autopost
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node autopost.js
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID_2: ${{ secrets.FB_PAGE_ID_2 }}
          FB_PAGE_TOKEN_2: ${{ secrets.FB_PAGE_TOKEN_2 }}
          DRY_RUN: ${{ vars.DRY_RUN || '1' }}
          CHECK: ${{ inputs.check && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cards, path: out/, if-no-files-found: ignore, retention-days: 3 }
      - name: Save seen links
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state preview 2>/dev/null || git add state
          git diff --cached --quiet || (git commit -m "update seen links" && git push)
