name: debug assets
on: push
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dbg && cd dbg
          for f in core/util.js core/bengali.js data/ratios.js data/templates.js core/dom.js core/state.js features/autofit.js features/render.js ui/preview.js features/imaging.js features/scrape.js features/exporter.js features/publish.js features/batch.js ui/controls.js ui/mobile.js main.js; do
            curl -sS -A "Mozilla/5.0" "https://card.utsabtv.com/assets/js/$f" -o "$(echo $f | tr / _)"; done
          ls -la
          git config user.name autopost-bot; git config user.email autopost-bot@users.noreply.github.com
          git add . && git commit -qm "debug: card site assets" && git push origin HEAD
