name: YouTube copy
on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      check:
        description: 'Only test the YouTube tokens (uploads nothing)'
        type: boolean
        default: false
      video_id:
        description: 'Copy this main-channel video now (id from the youtu.be link)'
        type: string
        default: ''
      dry_run:
        description: 'Make the SEO text only, upload nothing'
        type: boolean
        default: false
concurrency: youtube
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node youtube.js
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_MAIN_REFRESH_TOKEN: ${{ secrets.YT_MAIN_REFRESH_TOKEN }}
          YT_TARGET_REFRESH_TOKEN: ${{ secrets.YT_TARGET_REFRESH_TOKEN }}
          YT_TARGET_REFRESH_TOKEN_2: ${{ secrets.YT_TARGET_REFRESH_TOKEN_2 }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          CHECK: ${{ inputs.check && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          VIDEO_ID: ${{ inputs.video_id }}
      - name: Save state
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "update youtube state" && (git push || (git pull --rebase -X theirs origin main && git push)))
