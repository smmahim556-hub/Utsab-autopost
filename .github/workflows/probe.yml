name: Feed probe
on:
  workflow_dispatch:
    inputs:
      script: { type: string, default: tools/probe.js }
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx playwright install chromium
      # Private key of this repo's runners (voice clone demo): kept only in the Actions cache, which only this repo's workflows can read.
      - uses: actions/cache@v4
        with: { path: ~/.vc-key, key: vc-key-v1 }
      - run: node ${{ inputs.script || 'tools/probe.js' }}
        env:
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ID_2: ${{ secrets.FB_PAGE_ID_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - if: always()
        run: |
          git config user.name "autopost-bot"; git config user.email "autopost-bot@users.noreply.github.com"
          git add -A preview state/*-probe.json && git commit -m "feed probe" && (git push || (git pull --rebase -X theirs origin main && git push))
