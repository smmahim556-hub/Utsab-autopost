name: Utsab TV cartoon story
on:
  workflow_dispatch:
    inputs:
      script: { type: string, description: 'Script file in stories/', default: stories/demo-newton.txt }
      tts: { type: string, description: 'eleven or edge', default: eleven }
      model: { type: string, description: 'Claude model that draws the scenes', default: claude-sonnet-5-5 }
concurrency: story
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx playwright install chromium
      - run: sudo apt-get install -y -qq ffmpeg && pipx install edge-tts
      - run: node story.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          STORY_SCRIPT: ${{ inputs.script }}
          STORY_TTS: ${{ inputs.tts }}
          STORY_MODEL: ${{ inputs.model }}
          STORY_OUT: preview/story-demo.mp4
      - name: Save demo
        if: always()
        run: |
          mkdir -p preview/story; cp out/story/*.svg out/story/plan.json preview/story/ 2>/dev/null || true
          git config user.name "autopost-bot"; git config user.email "autopost-bot@users.noreply.github.com"
          git add -A preview state/story-probe.json 2>/dev/null; git diff --cached --quiet || (git commit -m "story demo" && (git push || (git pull --rebase -X theirs origin main && git push)))
